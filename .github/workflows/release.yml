name: Release

# Push a tag like v0.2.0 to publish a release. The tag is the version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx ruff check .
      - run: shellcheck install.sh
      - run: uv run --no-project --with numpy --with opencv-python-headless --with pytest pytest
      - run: uv build
      - name: Stamp install.sh and write checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          wheel="dist/transcribe_call-$version-py3-none-any.whl"
          test -f "$wheel" || { echo "::error::expected $wheel, found: $(ls dist)"; exit 1; }
          sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          sed -e "s/@VERSION@/$version/" -e "s/@SHA256@/$sha/" install.sh > dist/install.sh
          grep -qx "VERSION=\"$version\"" dist/install.sh
          grep -qx "SHA256=\"$sha\"" dist/install.sh
          (cd dist && sha256sum *.whl *.tar.gz install.sh > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Installs the built wheel with the stamped installer on Apple Silicon, as users will.
  smoke:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install and run
        run: |
          version="${GITHUB_REF_NAME#v}"
          TRANSCRIBE_CALL_WHEEL="$(ls dist/*.whl)" sh dist/install.sh
          bin="$(uv tool dir --bin)/transcribe-call"
          "$bin" --version | grep -Fx "transcribe-call $version"
          "$bin" --help > /dev/null

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  # Runs the public one-liner against the new release. Skipped while the repo is private.
  verify:
    needs: publish
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - name: Install with the public one-liner
        run: |
          version="${GITHUB_REF_NAME#v}"
          curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" | sh
          "$(uv tool dir --bin)/transcribe-call" --version | grep -Fx "transcribe-call $version"
